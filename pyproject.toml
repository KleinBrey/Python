[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-quant-system"
version = "0.1.0"
description = "A股量化研究、数据接入与可视化系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pymongo>=4.10,<5",
  "tqdm>=4.67,<5",
]

[project.scripts]
stock-api = "backend.server:main"
stock-pipeline = "stock_core.pipelines.run_all:run"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "data*", "stock_core*"]
exclude = ["frontend*", "examples*"]
